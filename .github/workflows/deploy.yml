name: Deploy MkDocs to GitHub Pages
on:
  push:
    branches:
      - main          # 仅 main 分支
    paths:
      - 'docs/**'     # 仅 docs 目录变动
      - 'mkdocs.yml'  # 或 MkDocs 配置变动

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: 安装MkDocs及主题
      run: pip install mkdocs-material
    - name: 构建静态文档
      run: mkdocs build
    - name: 部署到GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: site
